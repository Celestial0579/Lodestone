name: CI

# Gitea Actions reads both .gitea/workflows and .github/workflows. The upstream
# GitHub workflows were removed because they build signed releases on GitHub's
# hosted macOS and Windows runners with GitHub-only secrets, none of which
# exists here; this checks what can be checked on a plain Linux runner.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # getShellEnv asks the user's login shell what environment it hands to a
      # program, and that environment is what git hooks run in. A container has
      # no user, so SHELL is unset, the code falls back to /bin/sh, and dash
      # under `-ilc` with an empty environment produces one containing nothing
      # but PWD - no PATH. Naming bash gives the tests the kind of login shell
      # any desktop would have.
      SHELL: /bin/bash
      # Every check appends here as well as to the console, so that a failure
      # can be reported somewhere readable. See "Report the failure" below.
      CI_LOG: ci.log

    defaults:
      run:
        # pipefail matters: without it `cmd | tee` reports tee's exit code, and
        # a failing check would quietly pass.
        shell: bash -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # build-essential compiles the vendored native modules during postinstall.
      # libsecret is the credential store on Linux; without it every test file
      # that reaches the accounts store fails to load at all.
      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev libsecret-1-0

      # postinstall fetches the data submodules from the hosts named in
      # .gitmodules, which are mirrors on this instance. This job does not need
      # them - they are only bundled when packaging - so it warns and carries
      # on if they cannot be reached.
      - name: Install dependencies
        run: yarn install --frozen-lockfile 2>&1 | tee -a "$CI_LOG"

      - name: Check formatting
        run: yarn prettier 2>&1 | tee -a "$CI_LOG"

      - name: Typecheck
        run: yarn tsc --noEmit -p tsconfig.json 2>&1 | tee -a "$CI_LOG"

      - name: Test the forge translation layer
        run: node script/test.mjs app/test/unit/gitea 2>&1 | tee -a "$CI_LOG"

      - name: Test
        run: yarn test:unit 2>&1 | tee -a "$CI_LOG"

      # This instance runs Forgejo 15.0.7, whose API has no endpoint for
      # workflow logs and whose web routes accept neither basic auth nor an API
      # token. A failing run therefore cannot be read programmatically at all,
      # so the run reports itself: the tracker holds an open issue exactly
      # while this branch is broken, and the script closes it again when a run
      # passes. See script/ci-report.py.
      #
      # Delete both steps to switch that off; nothing else depends on them.
      # The environment is repeated rather than hoisted to the job, so that a
      # token which can write to this repository is present only in these two
      # steps. `yarn install` runs postinstall scripts from the dependency
      # tree, and that is not a place to leave one lying about.
      - name: Report the failure
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_number }}
        run: python3 script/ci-report.py failure

      - name: Withdraw the report
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_number }}
        run: python3 script/ci-report.py success
