# Version updates. Security updates for vulnerable dependencies come on top of
# these; but `ignore` applies to security updates as well (GitHub's documentation
# of `ignore`), so a security fix inside an ignored range is not proposed. The
# ranges ignored for #133 are the ones that break the build or the tests, and
# the pull request that removes the cause removes the rule.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  # The build tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # #133: from 4.21.0 the unit tests fail on Windows with --conditions=import
      - dependency-name: tsx
        versions:
          - '>=4.21.0'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # What the app ships.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # #133: from 2.0.2 on, tslib does not load under the test runner's tsx hook
      # (checked version by version: 2.0.1 loads, 2.0.2 to 2.8.1 and 2.9 do not)
      - dependency-name: tslib
        versions:
          - '>=2.0.2'
      # #133: 1.0.28 and later ship the Copilot CLI in platform packages and
      # need vscode-jsonrpc 10; the build and license scripts and the webpack
      # resolution of vscode-jsonrpc have to follow first
      - dependency-name: '@github/copilot-sdk'
        versions:
          - '>=1.0.28'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
