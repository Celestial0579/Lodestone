name: Build the Windows setup

# Builds the installers a release is made from, on demand, and keeps them as an
# artifact together with their SHA-256 sums. It publishes nothing: the release
# is made by hand from what this leaves. The builds are unsigned (#23). The
# smoke test calls it too, to test the setup of a pull request.

on:
  workflow_dispatch:
  workflow_call:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # setup-node v5+ caches on its own; keep it off as before.
          package-manager-cache: false

      # postinstall compiles the native modules and fetches the data
      # submodules, which packaging bundles.
      - name: Install dependencies
        run: npm ci

      # The Electron version of package.json, app/.npmrc and the check must be the
      # same; stop before the long build when they are not (#143).
      - name: Check the Electron version
        run: npm run validate-electron-version
        env:
          RELEASE_CHANNEL: production

      - name: Build
        run: npm run build:prod
        env:
          NODE_ENV: production
          RELEASE_CHANNEL: production

      - name: Make the installers
        run: npm run package
        env:
          NODE_ENV: production
          RELEASE_CHANNEL: production

      - name: Write the SHA-256 sums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File |
            Where-Object { $_.Name -match '\.(exe|msi|nupkg)$' -or $_.Name -eq 'RELEASES' }
          $files | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lodestone-windows-x64
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.nupkg
            dist/RELEASES
            dist/SHA256SUMS.txt
          if-no-files-found: error
