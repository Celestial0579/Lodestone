name: CI

# The upstream GitHub workflows were removed because they build signed releases
# on hosted macOS and Windows runners with secrets that belong to GitHub
# Desktop, none of which exists here. This checks what can be checked without
# them: everything on a plain Linux runner, and the unit suite a second time on
# Windows. Releases are built and attached by hand.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # getShellEnv asks the user's login shell what environment it hands to a
      # program, and that environment is what git hooks run in. Name bash
      # explicitly, so the tests get the kind of login shell any desktop would
      # have rather than whatever the runner leaves in SHELL.
      SHELL: /bin/bash

    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # build-essential compiles the vendored native modules during postinstall.
      # libsecret is the credential store on Linux; without it every test file
      # that reaches the accounts store fails to load at all.
      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev libsecret-1-0

      # postinstall also fetches the data submodules from github.com. This job
      # does not need them - they are only bundled when packaging - so it would
      # warn and carry on if they could not be reached.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn prettier

      # The workflows this one replaced ran the linter; it was not carried over,
      # and three findings then sat on main unnoticed. `lint:src` rather than
      # `lint`, which would run Prettier a second time.
      - name: Lint
        run: yarn lint:src

      - name: Typecheck
        run: yarn tsc --noEmit -p tsconfig.json

      - name: Test the forge translation layer
        run: node script/test.mjs app/test/unit/gitea

      - name: Test
        run: yarn test:unit

  # Releases are built for Windows only, and until this job existed nothing in
  # CI ran there. The unit suite has cases that exist only on Windows, the four
  # shells of getShellEnv among them, and installing with the install scripts
  # compiles the native modules the way a release build does. Formatting, the
  # linter and the type check do not depend on the platform and stay with the
  # job above.
  windows:
    runs-on: windows-latest

    steps:
      # The runner's git turns line endings into CRLF on checkout. The fixtures
      # are exempt through .gitattributes, the rest of the tree is not, and a
      # test that reads a file from it should see it as the repository has it.
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # node-gyp finds the Visual Studio build tools and the Python the runner
      # comes with.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test:unit
