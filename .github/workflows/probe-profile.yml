name: Probe a Windows profile with umlauts

# Does the setup, the app and the uninstall work under a profile whose path has
# a space and an umlaut, such as C:\Users\Jürgen Müller (#88)? The profile path
# comes from the system, not from the environment, so a second local user is the
# only way to get one. The user has no password: the task that runs as it logs on
# with S4U, which needs none. Whatever Windows answers is the result, so the job
# does not fail on it.

on:
  pull_request:
    paths:
      - .github/workflows/probe-profile.yml
      - .github/profile/**
  workflow_dispatch:
    inputs:
      build-run:
        description: Run of "Build the Windows setup" whose installers to use
        required: true

permissions:
  contents: read
  actions: read

env:
  # The installers a pull request uses: the build of 1.0.5.
  DEFAULT_BUILD_RUN: '43912157568'

jobs:
  probe:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/profile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lodestone-windows-x64
          path: setup
          run-id: ${{ inputs.build-run || env.DEFAULT_BUILD_RUN }}
          github-token: ${{ github.token }}

      - name: Make the user and run the setup, the app and the uninstall as it
        continue-on-error: true
        run: |
          $name = 'Jürgen Müller'
          $work = 'C:\profile-test'
          New-Item -ItemType Directory $work -Force | Out-Null
          Copy-Item setup "$work\setup" -Recurse
          $version = [regex]::Match((Get-Content setup\RELEASES -Raw), 'Lodestone-(\S+)-full\.nupkg').Groups[1].Value
          Set-Content "$work\version.txt" $version
          Copy-Item .github\profile\as-user.ps1 "$work\as-user.ps1"
          icacls $work /grant 'Users:(OI)(CI)M' | Out-Null

          New-LocalUser -Name $name -NoPassword -AccountNeverExpires | Out-Null
          "created the user, SID: $((Get-LocalUser $name).SID)"

          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "runner user: $(whoami), administrator role: $admin"
          whoami /groups | Select-String 'Mandatory Label' | ForEach-Object { "integrity: $($_.Line.Trim())" }

          # Windows refused the first way (#88): neither the cmdlets nor schtasks
          # take a task for a user without a password. The OpenSSH server logs a
          # user on by public key with S4U, which needs no password either.
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          Set-Service sshd -StartupType Manual
          Start-Service sshd
          "sshd: $((Get-Service sshd).Status)"

          # The profile folder is made by Windows, so that it is the real one.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class Profile {
            [DllImport("userenv.dll", CharSet = CharSet.Unicode)]
            public static extern int CreateProfile(string sid, string userName, StringBuilder path, uint size);
          }
          '@
          $path = New-Object System.Text.StringBuilder 260
          $hr = [Profile]::CreateProfile((Get-LocalUser $name).SID.Value, $name, $path, 260)
          "profile made: 0x$('{0:X}' -f $hr), $path"

          $key = "$work\key"
          ssh-keygen -q -t ed25519 -N '' -f $key
          $ssh = Join-Path "$path" '.ssh'
          New-Item -ItemType Directory $ssh -Force | Out-Null
          Copy-Item "$key.pub" "$ssh\authorized_keys"
          icacls $ssh /inheritance:r /grant "SYSTEM:(OI)(CI)F" "BUILTIN\Administrators:(OI)(CI)F" "$env:COMPUTERNAME\${name}:(OI)(CI)F" | Out-Null

          $remote = "powershell -NoProfile -ExecutionPolicy Bypass -File $work\as-user.ps1"
          $result = ssh -i $key -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o BatchMode=yes "$name@localhost" $remote 2>&1
          "ssh as the user: exit $LASTEXITCODE"
          $result | ForEach-Object { "ssh says: $_" }

          $state = 'finished'
          $info = $null
          '--- what the user saw'
          if (Test-Path "$work\out.txt") { Get-Content "$work\out.txt" -Encoding UTF8 } else { 'no output: the logon was refused or the user could not write' }
          '--- profile folders'
          Get-ChildItem C:\Users -Directory | ForEach-Object { $_.FullName }

      - name: Clean up
        if: always()
        continue-on-error: true
        run: |
          Unregister-ScheduledTask -TaskName LodestoneProfileProbe -Confirm:$false -ErrorAction SilentlyContinue
          Remove-LocalUser -Name 'Jürgen Müller' -ErrorAction SilentlyContinue
